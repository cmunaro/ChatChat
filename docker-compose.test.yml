# Dedicated disposable test services. Never attach production/shared volumes.
# TEST_DATABASE_URL=ecto://chatchat:chatchat@localhost:15432/chatchat_test
# TEST_REDIS_URL=redis://localhost:6379/15
services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: chatchat
      POSTGRES_PASSWORD: chatchat
      POSTGRES_DB: chatchat_test
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U chatchat -d chatchat_test"]
      interval: 1s
      timeout: 5s
      retries: 30
  redis:
    image: redis:8.10.1-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 1s
      timeout: 5s
      retries: 30
