name: Images

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish ${{ matrix.release }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        release:
          - chatchat_web
          - chatchat_broker
          - chatchat_tcp

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve builder image from mise.toml
        id: versions
        shell: bash
        run: |
          elixir_version="$(sed -n 's/^elixir = "\(.*\)"/\1/p' mise.toml)"
          erlang_version="$(sed -n 's/^erlang = "\(.*\)"/\1/p' mise.toml)"
          test -n "$elixir_version"
          test -n "$erlang_version"
          elixir_version="${elixir_version%%-otp-*}"
          echo "image=hexpm/elixir:${elixir_version}-erlang-${erlang_version}-debian-bookworm-20260824-slim" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: ${{ !env.ACT }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        if: ${{ !env.ACT }}
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.release }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and publish image
        if: ${{ !env.ACT }}
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BUILDER_IMAGE=${{ steps.versions.outputs.image }}
            RELEASE_NAME=${{ matrix.release }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.release }}
          cache-to: type=gha,mode=max,scope=${{ matrix.release }}
          provenance: mode=max
          sbom: true

      - name: Build image locally
        if: ${{ env.ACT }}
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: ${{ matrix.release }}:act
          build-args: |
            BUILDER_IMAGE=${{ steps.versions.outputs.image }}
            RELEASE_NAME=${{ matrix.release }}
