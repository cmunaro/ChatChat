name: Test

on:
  push:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Format, compile, and test
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: chatchat_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d chatchat_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      MIX_ENV: test
      TEST_DATABASE_URL: ecto://postgres:postgres@localhost:5432/chatchat_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up tools from mise.toml
        uses: jdx/mise-action@v4

      - name: Install dependencies
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile with warnings as errors
        run: mix compile --warnings-as-errors

      - name: Migrate test database
        run: mix ecto.migrate

      - name: Run tests
        run: mix test
